name: 功能建议 / Feature request
description: 提出新的使用场景或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前可以先看看 [路线图](https://github.com/MuzeAnisichael/GreatSage/blob/main/docs/roadmap.md)，确认它是否已经在计划中。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么事情时遇到了不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 如果涉及打开软件、修改文件或执行命令，也请说明你希望如何确认这些操作。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代做法
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已经查看过路线图和已有的 Issue。
          required: true
