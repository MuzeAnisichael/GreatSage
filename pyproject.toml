[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greatsage"
version = "0.5.0a1"
description = "An auditable real-time desktop voice secretary"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "websockets>=13,<17", "numpy>=1.26,<3", "PyYAML>=6,<7",
  "PyAudioWPatch>=0.2.12.7; sys_platform == 'win32'", "psutil>=5.9,<8",
  "webrtcvad-wheels>=2.0.14", "python-multipart>=0.0.18", "av>=14,<19",
  "tiktoken>=0.9,<1",
  "langchain-openai==1.7.2", "langchain-ollama==1.1.0", "langchain-core==1.6.11",
  "openai==2.45.0", "ollama==0.6.3",
  "langgraph==1.2.15", "langgraph-checkpoint-sqlite==3.1.2",
  "langmem==0.0.30", "trustcall==0.0.39", "langchain==1.4.6",
  "langchain-anthropic==1.7.6", "anthropic==1.17.0", "dydantic==0.0.8",
  "mcp==2.3.0", "httpx2==2.13.1", "jsonschema==4.26.0",
  "pipecat-ai[deepgram]==1.13.0", "deepgram-sdk==7.14.0",
  "audioop-lts>=0.2.1; python_version >= '3.13'",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1,<2", "pywin32>=306; sys_platform == 'win32'"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
build = ["pyinstaller>=6.16,<7"]

[project.scripts]
greatsage = "greatsage.__main__:main"

[tool.setuptools.packages.find]
include = ["greatsage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
