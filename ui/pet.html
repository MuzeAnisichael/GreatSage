<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>GreatSage · 桌宠</title>
  <link rel="stylesheet" href="pet.css" />
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="7" r="1"/><circle cx="15" cy="7" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="17" r="1"/><circle cx="15" cy="17" r="1"/></symbol>
    <symbol id="i-console" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="12" rx="2"/><path d="M9 20h6M12 16.5V20"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M6 4.5 18.5 11l-5.5 1.5-2.5 5.5Z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></symbol>
  </svg>
  <div class="pet-shell">
    <div class="pet-toolbar"><span class="pet-handle" title="按住这里拖动桌宠"><svg class="icon"><use href="#i-grip"/></svg>GreatSage</span><div class="pet-tools"><button id="pet-console" aria-label="打开控制台" title="打开控制台"><svg class="icon"><use href="#i-console"/></svg></button><button id="pet-through" aria-label="鼠标穿透 10 秒" title="鼠标穿透 10 秒后自动恢复"><svg class="icon"><use href="#i-pointer"/></svg></button><button id="pet-hide" aria-label="收起桌宠" title="收起桌宠"><svg class="icon"><use href="#i-close"/></svg></button></div></div>
    <div class="pet-bubble-wrap"><div class="pet-bubble" id="pet-bubble" aria-live="polite"><span class="bubble-eyebrow" id="bubble-eyebrow">大贤者</span><p id="pet-message">正在连接你的秘书…</p></div></div>
    <button class="pet-character" id="pet-character" aria-label="摸摸 GreatSage" title="摸摸我"><div id="character-art"></div></button>
    <div class="pet-status"><span id="pet-dot"></span><span id="pet-state">连接中</span></div>
  </div>
  <script type="module" src="pet.js"></script>
</body>
</html>
